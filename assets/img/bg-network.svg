<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      .stroke { fill: none; stroke: #2f6f4e; stroke-opacity: .14; stroke-width: 2.2; stroke-linecap: round; }
      .leaf { fill: #2f6f4e; fill-opacity: .12; stroke: #2f6f4e; stroke-opacity: .18; stroke-width:1; }
      .flower { fill: #f2c0d1; stroke: #e97aa2; stroke-opacity:.18; stroke-width: .8; }
      .dot { fill: #2f6f4e; fill-opacity: .9; }
    </style>
  </defs>

  <!-- soft connecting strokes -->
  <g class="stroke">
    <g>
      <circle cx="150" cy="140" r="3.2"/>
      <circle cx="180" cy="120" r="3.2"/>
      <circle cx="210" cy="150" r="3.2"/>
      <circle cx="185" cy="165" r="3.0"/>
      <line x1="150" y1="140" x2="180" y2="120" />
      <line x1="180" y1="120" x2="210" y2="150" />
      <line x1="150" y1="140" x2="210" y2="150" />
    </g>

    <g>
      <circle cx="900" cy="200" r="3.2"/>
      <circle cx="930" cy="180" r="3.2"/>
      <circle cx="960" cy="210" r="3.2"/>
      <line x1="900" y1="200" x2="930" y2="180" />
      <line x1="930" y1="180" x2="960" y2="210" />
    </g>

    <g>
      <circle cx="300" cy="600" r="3.2"/>
      <circle cx="330" cy="580" r="3.2"/>
      <circle cx="360" cy="610" r="3.2"/>
      <line x1="300" y1="600" x2="330" y2="580" />
      <line x1="330" y1="580" x2="360" y2="610" />
    </g>

    <g>
      <circle cx="800" cy="620" r="3.2"/>
      <circle cx="830" cy="600" r="3.2"/>
      <circle cx="860" cy="630" r="3.2"/>
      <line x1="800" y1="620" x2="830" y2="600" />
      <line x1="830" y1="600" x2="860" y2="630" />
    </g>

    <g>
      <circle cx="560" cy="160" r="3.2"/>
      <circle cx="590" cy="140" r="3.2"/>
      <circle cx="620" cy="165" r="3.2"/>
      <line x1="560" y1="160" x2="590" y2="140" />
      <line x1="590" y1="140" x2="620" y2="165" />
    </g>
  </g>

  <!-- leaf clusters: stylized leaves attached to some clusters -->
  <g transform="translate(160,120)">
    <path class="leaf" d="M20 20 C 10 10, 5 40, 20 50 C35 40, 30 10, 20 20 Z" transform="translate(20,10) rotate(-10)" />
    <path class="leaf" d="M20 20 C 10 10, 5 40, 20 50 C35 40, 30 10, 20 20 Z" transform="translate(44,6) rotate(20) scale(0.8)" />
  </g>

  <g transform="translate(920,180)">
    <path class="leaf" d="M20 20 C 10 10, 5 40, 20 50 C35 40, 30 10, 20 20 Z" transform="translate(10,6) rotate(10) scale(1.1)" />
  </g>

  <!-- small flowers -->
  <g transform="translate(340,580)">
    <g class="flower">
      <circle cx="6" cy="0" r="2.2" />
      <circle cx="-2" cy="3" r="2.2" />
      <circle cx="8" cy="3" r="2.2" />
      <circle cx="3" cy="6" r="2.2" />
      <circle cx="3" cy="-3" r="2.2" />
      <circle cx="3" cy="1.5" r="1.6" fill="#fff" />
    </g>
  </g>

  <g transform="translate(780,600)">
    <g class="flower">
      <circle cx="6" cy="0" r="2.2" />
      <circle cx="-2" cy="3" r="2.2" />
      <circle cx="8" cy="3" r="2.2" />
      <circle cx="3" cy="6" r="2.2" />
      <circle cx="3" cy="-3" r="2.2" />
      <circle cx="3" cy="1.5" r="1.6" fill="#fff" />
    </g>
  </g>

  <!-- decorative dots echoing the original pattern -->
  <g>
    <circle class="dot" cx="150" cy="140" r="1.5" />
    <circle class="dot" cx="185" cy="165" r="1.5" />
    <circle class="dot" cx="900" cy="200" r="1.5" />
    <circle class="dot" cx="940" cy="240" r="1.5" />
    <circle class="dot" cx="300" cy="600" r="1.5" />
    <circle class="dot" cx="360" cy="610" r="1.5" />
    <circle class="dot" cx="800" cy="620" r="1.5" />
    <circle class="dot" cx="840" cy="655" r="1.5" />
  </g>
</svg>
